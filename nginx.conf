server {
    listen 80;
    listen [::]:80;

    # Replace with your actual domain or VPS IP
    server_name yourdomain.com www.yourdomain.com;

    root /var/www/donajyoti-dental;
    index index.html;

    # Gzip Compression for fast loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # Block access to backup folder and hidden files
    location ^~ /backup/ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    # Long-term caching for static assets
    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Main routing (supports both /about-us.html and /about-us)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Basic security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
